<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pick Tracker</title>
<style>
  :root { --bg:#111; --card:#1a1a1a; --line:#2a2a2a; --text:#ddd; --muted:#777; --green:#2ecc71; --red:#e74c3c; --amber:#f39c12; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, sans-serif; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .summary { display: flex; gap: 16px; margin-bottom: 16px; font-size: 13px; }
  .summary span { color: var(--muted); }
  .summary b { color: var(--text); }
  .w b { color: var(--green); }
  .l b { color: var(--red); }
  .p b { color: var(--amber); }
  .pct b { color: var(--text); }

  /* Filters */
  .filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters button { background: var(--card); border: 1px solid var(--line); color: var(--muted);
    padding: 4px 12px; border-radius: 14px; cursor: pointer; font-size: 12px; }
  .filters button.on { background: #2a2a2a; color: var(--text); border-color: #555; }

  /* Day group */
  .date-header { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    padding: 12px 0 4px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }

  /* Pick row */
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #1e1e1e; }
  .sport-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; text-transform: uppercase; }
  .sport-tag.MLB { background: #1a3050; color: #6fb4e8; }
  .sport-tag.NFL { background: #3a2e1d; color: #ffc46b; }
  .sport-tag.CFB { background: #332a1d; color: #ffd27c; }
  .cat { font-size: 11px; color: var(--muted); min-width: 80px; }
  .pick-text { flex: 1; font-size: 13px; }
  .status { font-size: 11px; font-weight: 700; min-width: 28px; text-align: center; }
  .status.W { color: var(--green); }
  .status.L { color: var(--red); }
  .status.pending { color: var(--amber); }
  .btns { display: flex; gap: 4px; }
  .btns button { border: none; border-radius: 4px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; color: #fff; }
  .btns .w { background: #27ae60; }
  .btns .l { background: #c0392b; }
  .btns .undo { background: #333; color: var(--muted); padding: 3px 8px; }
  .btns .undo:hover { color: #fff; }
</style>
</head>
<body>

<h1>Pick Tracker</h1>
<p class="meta">Grade your picks. Changes save instantly.</p>

<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
<div id="list"></div>

<script>
let all = [];
let filterSport = "ALL";
let filterStatus = "ALL";

async function load() {
  const r = await fetch("/api/picks");
  all = await r.json();
  render();
}

function render() {
  // Summary
  const w = all.filter(p => p.status === "W").length;
  const l = all.filter(p => p.status === "L").length;
  const p = all.filter(p => p.status === "pending").length;
  const pct = w + l > 0 ? Math.round(w / (w + l) * 100) : null;
  document.getElementById("summary").innerHTML =
    '<span class="w">W: <b>' + w + '</b></span>' +
    '<span class="l">L: <b>' + l + '</b></span>' +
    '<span class="p">Pending: <b>' + p + '</b></span>' +
    (pct !== null ? '<span class="pct">Win: <b>' + pct + '%</b></span>' : '');

  // Filters
  var sports = ["ALL"].concat([...new Set(all.map(p => p.sport))]);
  var statuses = ["ALL", "pending", "W", "L"];
  var statusLabels = { ALL: "All", pending: "Pending", W: "Won", L: "Lost" };
  document.getElementById("filters").innerHTML =
    sports.map(s => '<button class="' + (filterSport === s ? "on" : "") + '" onclick="setSport(\'' + s + '\')">' + s + '</button>').join("") +
    statuses.map(s => '<button class="' + (filterStatus === s ? "on" : "") + '" onclick="setStatus(\'' + s + '\')">' + statusLabels[s] + '</button>').join("");

  // Filtered picks
  var picks = all.filter(p =>
    (filterSport === "ALL" || p.sport === filterSport) &&
    (filterStatus === "ALL" || p.status === filterStatus)
  );

  // Group by date
  var grouped = {};
  picks.forEach(p => { (grouped[p.date] = grouped[p.date] || []).push(p); });
  var dates = Object.keys(grouped).sort().reverse();

  if (!dates.length) {
    document.getElementById("list").innerHTML = '<div style="color:var(--muted);padding:30px 0;text-align:center">No picks to show.</div>';
    return;
  }

  document.getElementById("list").innerHTML = dates.map(d => {
    var rows = grouped[d].map(p => {
      var badge = p.status === "W" ? '<span class="status W">W</span>'
        : p.status === "L" ? '<span class="status L">L</span>'
        : '<span class="status pending">—</span>';
      var btns = p.status === "pending"
        ? '<button class="w" onclick="grade(\'' + p.id + '\',\'W\')">W</button>' +
          '<button class="l" onclick="grade(\'' + p.id + '\',\'L\')">L</button>'
        : '<button class="undo" onclick="grade(\'' + p.id + '\',\'pending\')">↩</button>';
      return '<div class="row">' +
        '<span class="sport-tag ' + p.sport + '">' + p.sport + '</span>' +
        '<span class="cat">' + p.category + '</span>' +
        '<span class="pick-text">' + esc(p.pick) + '</span>' +
        badge +
        '<span class="btns">' + btns + '</span></div>';
    }).join("");
    var dt = new Date(d + "T12:00:00Z");
    var label = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return '<div class="date-header">' + label + '</div>' + rows;
  }).join("");
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function setSport(s) { filterSport = s; render(); }
function setStatus(s) { filterStatus = s; render(); }

async function grade(id, result) {
  var r = await fetch("/api/grade", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, result: result })
  });
  if (r.ok) { await load(); }
  else { alert(await r.text()); }
}

load();
</script>
</body>
</html>
